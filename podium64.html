<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAX FPV Arena — Championship Podium</title><style>body{margin:0;background:#071023;color:#edf8ff;font:16px system-ui}main{max-width:1080px;margin:auto;padding:24px}h1{color:#55f6df}a{color:#78ddff;margin-right:15px}.panel{background:#12233e;border:1px solid #34547d;border-radius:16px;padding:18px;margin:16px 0}button{background:#12cdb7;color:#001927;padding:10px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}canvas{width:100%;background:#06162c;border-radius:14px}small{color:#a6bbd1}</style><style>.podium{display:flex;align-items:end;justify-content:center;gap:14px;min-height:350px}.place{text-align:center;border-radius:16px 16px 0 0;padding:24px 14px;min-width:120px;max-width:28%;overflow-wrap:anywhere}.first{height:240px;background:linear-gradient(#ffe391,#a56c16);color:#211602}.second{height:170px;background:linear-gradient(#e1edff,#637996);color:#091a30}.third{height:125px;background:linear-gradient(#f6b97d,#a25b33);color:#261306}</style><main><nav><a href="lobby.html">Command Center</a><a href="tournament63.html">Brackets</a><a href="spectator64.html">3D View</a><a href="highlights64.html">Highlights</a><a href="podium64.html">Podium</a></nav><h1>🏆 Championship Podium</h1><p>Celebrate the top pilots in our off-chain exhibition tournament.</p><div id="message" role="status"></div><div class="podium" id="podium"></div><div id="semis" class="panel"></div><small>Cosmetic celebration only. No NFT has been minted and no token prizes are awarded.</small></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('/api/tournament64/podium');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.status!=='complete'){document.getElementById('message').textContent='The championship is '+d.status+'. Podium will unlock after the final.';return}document.getElementById('message').textContent='Tournament '+d.tournamentId+' completed!';document.getElementById('podium').innerHTML=`<div class="place second"><h2>🥈 2nd</h2><strong>${esc(d.runnerUp||'')}</strong></div><div class="place first"><h2>🥇 Champion</h2><strong>${esc(d.champion||'')}</strong></div><div class="place third"><h2>🥉 Semifinalists</h2><strong>${(d.semifinalists||[]).map(esc).join(' / ')}</strong></div>`;document.getElementById('semis').textContent='Championship exhibition trophy display · No financial rewards.'}catch(e){document.getElementById('message').textContent='Podium unavailable: '+e.message}}load();</script></html>
