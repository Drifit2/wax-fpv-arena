<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAX FPV Arena — Team Leaderboard</title><style>body{margin:0;background:#080d1c;color:#eaf5ff;font:16px system-ui,sans-serif}main{max-width:1000px;margin:0 auto;padding:24px}h1{color:#67f4ed}a{color:#80caff}table{width:100%;border-collapse:collapse;background:#121d34;border-radius:12px;overflow:hidden}th,td{padding:12px 8px;border-bottom:1px solid #293957;text-align:left}th{color:#a2c8ff}tr:first-child td{color:#b9ffe2}p{color:#b9c8de}button{background:#146a7b;color:white;border:0;border-radius:8px;padding:12px 20px;cursor:pointer}#error{color:#ffb5b5}</style></head><body><main><a href="index.html">← Arena home</a><h1>2v2 Pilot Leaderboard</h1><p>Provisional off-chain standings from the most recent 100 server-recorded races. No NFT or cash prizes; interrupted races excluded.</p><button id="refresh">Refresh standings</button><p id="error" role="status"></p><table><thead><tr><th>Rank</th><th>Pilot</th><th>Wins</th><th>Losses</th><th>Finishes</th><th>Gates</th><th>Score</th></tr></thead><tbody id="rows"><tr><td colspan="7">Loading…</td></tr></tbody></table></main><script>async function load(){const error=document.getElementById('error'),body=document.getElementById('rows');error.textContent='';try{const response=await fetch('/api/team83/leaderboard',{cache:'no-store'});if(!response.ok)throw Error('Unable to load leaderboard');const data=await response.json();body.replaceChildren();if(!data.standings.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=7;td.textContent='No completed races recorded yet.';tr.append(td);body.append(tr);return}for(const p of data.standings){const tr=document.createElement('tr');for(const key of ['rank','account','wins','losses','finishes','gates','score']){const td=document.createElement('td');td.textContent=String(p[key]);tr.append(td)}body.append(tr)}}catch(e){error.textContent=e.message;body.replaceChildren()}}document.getElementById('refresh').addEventListener('click',load);load();</script></body></html>
