<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WAX FPV Arena — Highlights</title><style>body{margin:0;background:#071023;color:#edf8ff;font:16px system-ui}main{max-width:1080px;margin:auto;padding:24px}h1{color:#55f6df}a{color:#78ddff;margin-right:15px}.panel{background:#12233e;border:1px solid #34547d;border-radius:16px;padding:18px;margin:16px 0}button{background:#12cdb7;color:#001927;padding:10px 16px;border:0;border-radius:9px;font-weight:800;cursor:pointer}canvas{width:100%;background:#06162c;border-radius:14px}small{color:#a6bbd1}</style><main><nav><a href="lobby.html">Command Center</a><a href="tournament63.html">Brackets</a><a href="spectator64.html">3D View</a><a href="highlights64.html">Highlights</a><a href="podium64.html">Podium</a></nav><h1>⚡ Championship Highlights</h1><p>Server-recorded tournament finishes and a replayable result timeline. These are results summaries, not reconstructed flight recordings.</p><div id="highlights" role="status"></div></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch('/api/tournament64/highlights');if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();document.getElementById('highlights').innerHTML=(d.races||[]).map((m,i)=>`<article class="panel"><small>Highlight ${i+1} · ${esc(m.completedAt||'')}</small><h2>🏁 ${esc(m.winner||'No winner')}</h2><p>${m.results.map(p=>`${esc(p.account)} — ${Number(p.elapsed)||0}s · ${esc(p.status)}`).join(' versus ')}</p><small>Race ${esc(m.id)} · ${esc(m.reason)}</small></article>`).join('')||'<div class="panel">No completed tournament races in the retained match history yet.</div>'}catch(e){document.getElementById('highlights').textContent='Highlights unavailable: '+e.message}}load();</script></html>
