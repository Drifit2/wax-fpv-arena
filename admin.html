<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPV Arena — Practice Integrity Admin</title><style>body{background:#08121e;color:#edf8ff;font:16px system-ui;max-width:1100px;margin:auto;padding:24px}button,input,select,textarea{background:#132a3d;color:white;border:1px solid #4cb9d6;padding:10px;border-radius:7px}button{cursor:pointer}section{border:1px solid #355268;padding:15px;margin:12px 0;border-radius:10px}small{color:#b5cad7}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:95%}</style><h1>Championship Integrity — Admin</h1><p>Practice-only manual audits. No NFT minting or prize approval.</p><label>Administrator token <input id="token" type="password" autocomplete="off" placeholder="FPV_ADMIN_TOKEN"></label> <button onclick="load()">Load review queue</button><p id="message" role="status"></p><main id="queue"></main><script>
const token=document.querySelector('#token'),queue=document.querySelector('#queue'),msg=document.querySelector('#message');
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'x-fpv-admin-token':token.value,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){try{const d=await api('/api/admin46/queue');queue.replaceChildren();for(const row of d.rows){const section=document.createElement('section');const h=document.createElement('h3');h.textContent=row.account+' — '+row.status;section.append(h);const p=document.createElement('p');p.textContent='Request '+row.id+' | '+row.createdAt+' | Flags: '+(row.flags.join(', ')||'none detected');section.append(p);const detail=document.createElement('pre');detail.textContent=JSON.stringify(row.evidence,null,2);section.append(detail);const select=document.createElement('select');for(const val of ['needs_investigation','reviewed_practice','rejected_practice']){const option=document.createElement('option');option.value=val;option.textContent=val;select.append(option)}section.append(select);const reason=document.createElement('textarea');reason.placeholder='Document evidence and reason (minimum 8 characters)';reason.rows=2;section.append(reason);const button=document.createElement('button');button.textContent='Record review decision';button.onclick=async()=>{try{await api('/api/admin46/decision','POST',{id:row.id,status:select.value,reason:reason.value});await load();msg.textContent='Practice review decision recorded.'}catch(e){msg.textContent=e.message}};section.append(button);const inspect=document.createElement('button');inspect.textContent='Inspect account records';inspect.onclick=async()=>{try{const d=await api('/api/admin46/records?account='+encodeURIComponent(row.account));detail.textContent=JSON.stringify(d,null,2)}catch(e){msg.textContent=e.message}};section.append(inspect);queue.append(section)}msg.textContent=d.rows.length+' review requests. No prize issuance available.'}catch(e){msg.textContent=e.message}}
</script></html>
