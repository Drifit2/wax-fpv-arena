<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Club Wars 2v2 · Alpha 7.4</title><style>body{background:#071321;color:#eaffff;font:16px system-ui;padding:20px}main{max-width:950px;margin:auto}section{background:#12283a;padding:16px;border-radius:12px;margin:12px 0}button{padding:12px;background:#2ee6c9;border:0;border-radius:8px;font-weight:800}input,select{padding:10px;margin:5px;background:#20394a;color:white;border:1px solid #497086}a{color:#69f1df}pre{white-space:pre-wrap}</style><main><a href="lobby.html">← Lobby</a><h1>Club Wars · 2v2 Championship</h1><p>Captains choose two distinct club pilots each. Once both lineups are confirmed and the fixture is scheduled, all four pilots can join their dedicated race. Results are provisional exhibition results, not blockchain-verified.</p><section><h2>Captain lineup</h2><label>Fixture ID <input id="fixture" placeholder="war-..."></label><label>Side <select id="side"><option value="home">Home</option><option value="away">Away</option></select></label><label>Pilot 1 <input id="p1" placeholder="WAX account"></label><label>Pilot 2 <input id="p2" placeholder="WAX account"></label><button id="save">Confirm lineup</button><p id="message"></p></section><section><h2>2v2 fixtures</h2><button id="refresh">Refresh</button><div id="fixtures"></div></section></main><script>const $=id=>document.getElementById(id);let token='';try{token=JSON.parse(sessionStorage.getItem('waxfpv:verifiedSession')||'{}').token||''}catch{}async function load(){const r=await fetch('/api/club73/fixtures');const d=await r.json();$('fixtures').replaceChildren(...(d.fixtures||[]).map(f=>{const el=document.createElement('section');const title=document.createElement('h3');title.textContent=f.id+' · '+f.home+' vs '+f.away+' · '+f.status;el.append(title);const detail=document.createElement('p');detail.textContent='Starts '+f.startsAt+' · score '+(f.scores[f.home]||0)+'–'+(f.scores[f.away]||0)+' · home '+(f.lineups73?.[f.home]||[]).join(', ')+' · away '+(f.lineups73?.[f.away]||[]).join(', ');el.append(detail);const link=document.createElement('a');link.href='team-racing73.html?fixture='+encodeURIComponent(f.id);link.textContent='Open 2v2 race';el.append(link);const live=document.createElement('p');live.textContent='Queued: '+(f.queued||[]).join(', ')+' · live races: '+(f.live||[]).length;el.append(live);return el}));} $('save').onclick=async()=>{try{const r=await fetch('/api/club73/lineup',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id:$('fixture').value,side:$('side').value,pilots:[$('p1').value.trim(),$('p2').value.trim()]})});const d=await r.json();$('message').textContent=r.ok?'Lineup confirmed':d.error||'Request failed';await load()}catch(e){$('message').textContent=e.message}};$('refresh').onclick=load;load();setInterval(load,5000);</script></html>
